services:
  vibe-moto-server:
    build: .
    container_name: vibe-moto-server
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":25580"
      MC_ADDR: ":25565"
      DATA_DIR: "/app/data"
      MC_MOTD: "VIBE MOTO Open World // 暴力摩托开放世界"
      PUBLIC_HOST: "moto.linkof.link"
    ports:
      - "127.0.0.1:25580:25580"
      - "0.0.0.0:25565:25565"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:25580/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
